name: relay

volumes:
  postgres-data:
  relay-data:

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  image: relay-backend:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://relay_app:${APP_DB_PASSWORD}@postgres:5432/relay
    WAREHOUSE_URL: postgresql+psycopg://relay_app:${APP_DB_PASSWORD}@postgres:5432/warehouse
  volumes:
    - ./backend/app:/app/app
    - ./backend/tests:/app/tests
    - ./pipelines:/app/pipelines
    - relay-data:/app/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # One Postgres server, two databases: relay (app + pgvector) and warehouse (demo pipeline data).
  # The app uses the non-superuser role relay_app so row-level security isolates each company.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: relay
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 20

  # FastAPI: REST API, webhooks, ingest endpoints, warehouse runner.
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  # Background worker: AI jobs (summaries, plans, meetings, investigations) and the daily schedule
  # (06:00 pipelines, 07:00 day plans, 08:00 feed). An external orchestrator is optional: see KESTRA.md.
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]

  # Frontend: React build served by nginx; /api is proxied to the api service.
  web:
    build: ./web
    image: relay-web:dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:80"
    depends_on:
      - api
