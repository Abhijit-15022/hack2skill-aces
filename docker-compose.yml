name: relay

volumes:
  postgres-data:
  kestra-data:

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  image: relay-backend:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://relay_app:${APP_DB_PASSWORD}@postgres:5432/relay
    WAREHOUSE_URL: postgresql+psycopg://relay_app:${APP_DB_PASSWORD}@postgres:5432/warehouse
    KESTRA_URL: http://kestra:8080
  volumes:
    - ./backend/app:/app/app
    - ./backend/tests:/app/tests
    - ./pipelines:/app/pipelines
    - ./kestra-flows:/app/kestra_flows:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  # One Postgres server, three databases: relay (app + pgvector), kestra, warehouse (demo data).
  # The app uses the non-superuser role relay_app so row-level security isolates each company.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: relay
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kestra orchestrator (stable 2.0.x release; the slim image has all the core tasks our flows use).
  kestra:
    image: kestra/kestra:v2.0.3-slim
    pull_policy: missing
    command: ["server", "standalone"]
    restart: unless-stopped
    user: "root"  # the named storage volume is root-owned; same as Kestra's own dev compose
    stop_grace_period: 1m
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: relay
            password: ${POSTGRES_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_USER}
              password: ${KESTRA_PASSWORD}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    volumes:
      - kestra-data:/app/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # FastAPI: REST API, webhooks, ingest endpoints, warehouse runner.
  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  # Background worker: summarise, match tasks/SOP steps, on-call investigations, feed.
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]

  # Frontend: React build served by nginx; /api is proxied to the api service.
  web:
    build: ./web
    image: relay-web:dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3100}:80"
    depends_on:
      - api
